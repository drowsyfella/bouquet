<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>for Em yêu</title>
  <meta name="theme-color" content="#FDF1F3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blush: #FDF1F3;
      --pink: #E58FA5;
      --ink: #6B4A52;
      --cream: #FFFBF6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #FFFFFF 0%, var(--blush) 75%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      user-select: none; -webkit-user-select: none;
    }
    #scene {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none;
      opacity: 0; transition: opacity 1.2s ease, filter .4s ease;
    }
    #scene.on { opacity: 1; }
    #scene.dim { filter: brightness(.88) blur(1px); }

    /* Gate */
    #gate {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--blush); cursor: pointer;
      transition: opacity .6s ease;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    #gate svg { width: 34px; height: 34px; animation: beat 2.4s ease-in-out infinite; }
    #gate .t { font-size: 15px; letter-spacing: .12em; text-transform: lowercase; opacity: .8; }
    #gate .s { font-size: 11px; opacity: .45; position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    /* Hint */
    #hint {
      position: fixed; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom));
      text-align: center; font-size: 13px; letter-spacing: .1em; opacity: 0;
      transition: opacity 1s ease; pointer-events: none;
    }
    #hint.on { opacity: .55; }

    /* Mute */
    #mute {
      position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top)); right: 14px;
      width: 40px; height: 40px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.6); color: var(--ink); cursor: pointer;
      display: none; align-items: center; justify-content: center;
    }
    #mute.on { display: flex; }
    #mute svg { width: 20px; height: 20px; }
    #mute .x { display: none; }
    #mute.muted .w { display: none; }
    #mute.muted .x { display: inline; }

    /* Card */
    #overlay {
      position: fixed; inset: 0; z-index: 8;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      visibility: hidden; opacity: 0; transition: opacity .4s ease, visibility 0s linear .4s;
    }
    #overlay.on { visibility: visible; opacity: 1; transition: opacity .3s ease; }
    #overlay.on.out { opacity: 0; transition: opacity .4s ease; }
    #stage { position: relative; width: 100%; max-width: 320px; perspective: 900px; }

    /* Envelope: back, card, front pocket, flap (stacked in that order) */
    .env {
      position: absolute; left: 0; right: 0; bottom: -14px; height: 220px;
      pointer-events: none; opacity: 0; border-radius: 10px;
    }
    .env-back { background: #EFC9D2; z-index: 1; }
    .env-flapwrap { z-index: 4; perspective: 700px; }
    .env-front {
      z-index: 3; background: #F8E1E6;
      clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
      box-shadow: 0 18px 40px rgba(150, 90, 105, .2);
    }
    .env-flap {
      position: absolute; left: 0; right: 0; top: 0; height: 62%; border-radius: 10px 10px 0 0;
      background: #F3D2DA; transform-origin: 50% 0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .env-flap svg { position: absolute; left: 50%; bottom: 6px; width: 26px; height: 26px; margin-left: -13px; }

    #card {
      position: relative; z-index: 2; width: 100%;
      background: var(--cream); border-radius: 18px;
      box-shadow: 0 18px 50px rgba(150, 90, 105, .22), 0 2px 8px rgba(150, 90, 105, .1);
      padding: 40px 28px 32px; text-align: center;
      font-family: "Caveat", cursive; font-weight: 500; color: var(--ink);
      transform: translateY(28px) scale(.8);
    }
    #card p { margin: 0; }
    #card .msg { font-size: 34px; line-height: 1.25; }
    #card .to { font-size: 38px; margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #card .to svg { width: 24px; height: 24px; }
    #card .from { font-size: 30px; margin-top: 18px; text-align: right; }
    #card p, #close { opacity: 0; }
    #close {
      position: absolute; top: 8px; right: 8px; width: 36px; height: 36px;
      border: 0; background: none; color: var(--ink); cursor: pointer;
      font-size: 22px; line-height: 1;
    }

    /* Open sequence: envelope rises in, flap opens, card slides out and settles,
       envelope drops away, then the lines write in one by one */
    #overlay.on .env { animation: envIn .45s ease-out both, envOut .5s ease-in 1.75s forwards; }
    #overlay.on .env-flapwrap { animation: envIn .45s ease-out both, envOut .5s ease-in 1.75s forwards, flapZ .55s linear .45s both; }
    #overlay.on .env-flap { animation: flapOpen .55s ease-in-out .45s both; }
    #overlay.on .env-flap svg { animation: fadeOut .2s ease .45s both; }
    #overlay.on #card { animation: cardOut 1.15s cubic-bezier(.3,.7,.3,1) .85s both; }
    #overlay.on #card .msg { animation: write .7s ease 1.9s both; }
    #overlay.on #card .to { animation: write .7s ease 2.3s both; }
    #overlay.on #card .from { animation: write .7s ease 2.7s both; }
    #overlay.on #close { animation: fade .4s ease 2.6s both; }

    @keyframes envIn { from { opacity: 0; transform: translateY(40px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes envOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(90px); } }
    @keyframes flapOpen { from { transform: rotateX(0); } to { transform: rotateX(180deg); } }
    @keyframes flapZ { 0%, 50% { z-index: 4; } 51%, 100% { z-index: 0; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes cardOut {
      0% { transform: translateY(28px) scale(.8); z-index: 2; }
      45% { transform: translateY(-150px) scale(.86); z-index: 2; }
      46% { z-index: 5; }
      100% { transform: translateY(0) scale(1); z-index: 5; }
    }
    @keyframes write { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: .5; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="gate" role="button" aria-label="tap to open">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#E58FA5" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
    <div class="t">tap to open</div>
    <div class="s">sound on for the full effect</div>
  </div>

  <div id="hint">tap the ribbon</div>

  <button id="mute" aria-label="mute">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
      <path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="x" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>

  <div id="overlay">
    <div id="stage">
      <div class="env env-back"></div>
      <div class="env env-front"></div>
      <div class="env env-flapwrap"><div class="env-flap"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#E58FA5" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></div></div>
      <div id="card" role="dialog" aria-label="message">
        <button id="close" aria-label="close">×</button>
        <p class="msg">Get well soon and speedy recovery</p>
        <p class="to">Em yêu <svg viewBox="0 0 24 24" aria-label="heart"><path fill="#E58FA5" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></p>
        <p class="from">- Noah</p>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
